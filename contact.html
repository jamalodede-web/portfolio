<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jamal Odede</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Jamal.dev</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Get In <span class="highlight">Touch</span></h1>
            <p>Have a question or want to connect? Send me a message below.</p>
        </section>

        <section class="projects-section" style="max-width: 600px;">
            <div class="project-card">
                <form action="https://api.web3forms.com/submit" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                    
                    <!-- Web3Forms Access Key -->
                    <input type="hidden" name="access_key" value="69628e36-ad3b-428a-92ee-c7975042c7c3">

                    <label style="color: #94a3b8; font-weight: 500;">Name</label>
                    <input type="text" name="name" placeholder="Your Name" style="padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none;" required>
                    
                    <label style="color: #94a3b8; font-weight: 500;">Email</label>
                    <input type="email" name="email" placeholder="Your Email" style="padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none;" required>
                    
                    <label style="color: #94a3b8; font-weight: 500;">Message</label>
                    <textarea name="message" rows="5" placeholder="Say hello..." style="padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; font-family: inherit;" required></textarea>
                    
                    <button type="submit" class="btn btn-primary" style="cursor: pointer; border: none; font-size: 1rem; align-self: flex-start; margin-top: 10px;">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jamal Odede. Built with HTML, CSS, and JavaScript.</p>
    </footer>
</body>
</html>
