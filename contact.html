<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jamal Odede</title>
    <!-- Version query parameter ?v=3 forces mobile browsers to bypass old cache -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Jamal.dev</a>
            
            <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="projects-section">
            <div class="project-card">
                <h2>Get In Touch</h2>
                <form action="https://api.web3forms.com/submit" method="POST">
                    
                    <!-- Web3Forms Access Key -->
                    <input type="hidden" name="access_key" value="69628e36-ad3b-428a-92ee-c7975042c7c3">

                    <!-- Custom email subject line -->
                    <input type="hidden" name="subject" value="New Portfolio Contact Form Submission">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="jamalodede@gmail.com" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Say hello..." required></textarea>

                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
